---
extends: "default"

ignore:
  - "**/.venv/*"
  - "**/.tox/*"
  - ".copier-answers.yml"  # generated by copier

rules:
  line-length:
    max: 120
  comments:
    require-starting-space: true
    min-spaces-from-content: 2
  quoted-strings:
    quote-type: "double"
    required: true
    check-keys: false
